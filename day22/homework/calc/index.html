<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainCalc">
      <div id="monitor">
        <h1>00</h1>
      </div>
      <div id="mainbuttons">
        <button id="DEl">DEL</button>
        <button id="Clear">C</button>
        <button id="percent">%</button>
        <button class="orange" id="divide">/</button>
        <button class="dark" id="seven">7</button>
        <button class="dark" id="eight">8</button>
        <button class="dark" id="nine">9</button>
        <button class="orange" id="X">X</button>
        <button class="dark" id="four">4</button>
        <button class="dark" id="five">5</button>
        <button class="dark" id="six">6</button>
        <button class="orange" id="minus">-</button>
        <button class="dark" id="one">1</button>
        <button class="dark" id="two">2</button>
        <button class="dark" id="three">3</button>
        <button class="orange" id="plus">+</button>
        <button class="dark" id="change">+/-</button>
        <button class="dark" id="zero">0</button>
        <button class="dark" id="flot">,</button>
        <button class="orange" id="equals">=</button> 
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
