<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <title>Frontend Mentor | Profile card component</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="mainBackground">
    <div class="firstCircle"></div>
    <div class="cardmain">
      <div class="card">
        <div class="poto">
          <div class="icon">
            <img src="image-victor.jpg">
          </div>
          <div class="victor">
            <h1>Victor Crest <span>26</span> </h1>
            <h3>London</h3>
          </div>
          <div class="info">
            <div class="Followers">
              <h3>80K</h3>
              <p>Followers</p>
            </div>
            <div class="Likes">
              <h3>803K</h3>
              <p>Likes</p>
            </div>
            <div class="Photos">
              <h3>1.4K</h3>
              <p>Photos</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="SecondCircle"></div>
  </div>
  
</body>
</html>
