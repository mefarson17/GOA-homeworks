<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" >
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
    <div class="mainSquare">
        <div class="mainBox">
            
              <div class="picBox">
              <img id="poto" src="image-equilibrium.jpg">
              
                <div class="over">
                <img id="view" src="icon-view.svg">
                </div>
              </div>
            
            <div class="equilibrium">
                <h2>Equilibrium #3429</h2>
                <p>Our Equilibrium collection promotes balance and calm.</p>
            </div>
            <div class="ETH">
                <div class="eth">
                <img src="icon-ethereum.svg">
                <p> 0.041 ETH</p>
                </div>
                <div class="days">
                    <img src="icon-clock.svg">
                    <span>3 days left</span>
                </div>
            </div>
            <div class="footer">
                    <img id="avatar" src="image-avatar.png">
                    <p>Creation of <span> Jules Wyvern</span></p>
            </div>
        </div>
    </div>
</body>
</html>
